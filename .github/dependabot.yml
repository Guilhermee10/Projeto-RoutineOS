# Dependabot abre PRs automáticos quando uma dependência tem versão nova ou
# vulnerabilidade conhecida.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
