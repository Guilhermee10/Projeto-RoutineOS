# PRODUÇÃO (AWS EC2): só a API e as migrations. O banco é o RDS (fora do
# Docker) e o frontend fica no S3/CloudFront.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Lê o arquivo ".env" desta pasta (veja .env.production.example). Esse arquivo
# fica SÓ no servidor e nunca vai para o Git.
services:
  # Aplica as migrations no RDS (prisma migrate deploy) e termina.
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: routineos-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:?defina CORS_ORIGIN no .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # porta 80 do servidor -> 3333 do container (o CloudFront chama a porta 80)
      - "80:3333"
